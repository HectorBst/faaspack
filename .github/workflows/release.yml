name: Release

# Publishes to PyPI with trusted publishing (OpenID Connect, no API token) when a version tag
# is pushed. One-time setup: a PyPI trusted publisher for this repository, workflow
# `release.yml` and environment `pypi`, and that environment created in the repository settings
# (ideally with a required reviewer).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false # no cache in release builds
      - name: Check that the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(uv version --short)" = "$TAG"
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/faaspack/
    permissions:
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create the GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$TAG" --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)."
