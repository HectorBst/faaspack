[project]
name = "faaspack"
version = "0.1.0"
description = "Build optimized Python deployment packages for AWS Lambda and Scaleway Serverless Functions from a uv project."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hector Basset", email = "hector.basset.dev@gmail.com" }]
keywords = ["aws-lambda", "lambda-layer", "scaleway", "serverless", "uv", "packaging", "cold-start"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
faaspack = "faaspack.cli:main"

[project.entry-points."faaspack.targets"]
lambda = "faaspack.targets.aws_lambda:LambdaTarget"
scaleway-functions = "faaspack.targets.scaleway:ScalewayFunctionsTarget"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "complexipy>=8.3",
    "diff-cover>=11",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=7",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "A", "ARG", "B", "BLE", "C4", "DTZ", "E", "ERA", "F", "FBT", "FLY", "FURB", "G", "I",
    "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S",
    "SIM", "SLOT", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    # faaspack drives uv, compileall, strip and docker with argument lists, never a shell
    # (S602/S604/S605 stay enabled to keep it that way).
    "S603",
    # Exception messages are written inline, next to the condition they describe.
    "TRY003",
    # Complexity debt, tracked by the complexipy snapshot until the pipeline refactor.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# The command line interface is the only module that writes to the terminal.
"src/faaspack/cli.py" = ["T201"]
# Target methods implement a plugin interface: some targets ignore some arguments.
"src/faaspack/targets/*.py" = ["ARG002"]
"tests/**" = ["PLC0415", "PLR2004", "S"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["visit_*"]  # ast.NodeVisitor dispatches on visit_<NodeClass>

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the uv binary and network access to PyPI",
    "docker: needs a running Docker daemon and the official runtime images",
]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["faaspack"]
relative_files = true  # lets CI combine data files from Linux and macOS jobs

[tool.coverage.paths]
source = ["src/faaspack", "*/site-packages/faaspack"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Whole suite: unit, integration and Docker tests, as combined in CI.
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "@abstractmethod"]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15
