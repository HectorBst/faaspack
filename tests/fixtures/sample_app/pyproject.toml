[project]
name = "sample-app"
version = "1.2.0"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.10", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.faaspack]
python = "3.14"

[tool.faaspack.lambda]
architectures = ["x86_64", "arm64"]
